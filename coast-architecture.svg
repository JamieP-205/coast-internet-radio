<svg width="1200" height="540" viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Coast Internet Radio architecture</title>
  <desc id="desc">Architecture diagram showing the listener browser, Netlify static site, Cloudflare stream and metadata Workers, Netlify Functions and Netlify Blobs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 800 19px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 16px Segoe UI, Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 18; }
      .note { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; rx: 16; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="540"/>
  <text class="title" x="600" y="62" text-anchor="middle">Coast Internet Radio Architecture</text>

  <rect class="box" x="55" y="205" width="190" height="110"/>
  <text class="label" x="150" y="246" text-anchor="middle">Listener</text>
  <text class="small" x="150" y="275" text-anchor="middle">Browser player</text>

  <rect class="accent" x="325" y="205" width="210" height="110"/>
  <text class="label" x="430" y="246" text-anchor="middle">Netlify</text>
  <text class="small" x="430" y="275" text-anchor="middle">Static website</text>

  <rect class="box" x="650" y="105" width="235" height="110"/>
  <text class="label" x="768" y="146" text-anchor="middle">Cloudflare Workers</text>
  <text class="small" x="768" y="175" text-anchor="middle">Stream + metadata proxies</text>

  <rect class="accent" x="650" y="305" width="235" height="110"/>
  <text class="label" x="768" y="346" text-anchor="middle">Netlify Functions</text>
  <text class="small" x="768" y="375" text-anchor="middle">Admin, analytics, feedback</text>

  <rect class="box" x="965" y="305" width="190" height="110"/>
  <text class="label" x="1060" y="346" text-anchor="middle">Netlify Blobs</text>
  <text class="small" x="1060" y="375" text-anchor="middle">Content + history</text>

  <path class="line" d="M245 260 H325"/>
  <path class="line" d="M535 235 C585 215 600 160 650 160"/>
  <path class="line" d="M535 285 C585 305 600 360 650 360"/>
  <path class="line" d="M885 360 H965"/>

  <rect class="note" x="330" y="455" width="540" height="58"/>
  <text class="label" x="600" y="481" text-anchor="middle">Static frontend, two HTTPS proxies and a serverless admin backend</text>
  <text class="small" x="600" y="503" text-anchor="middle">The public player talks to the Workers; admin and stored data stay behind Netlify Functions.</text>
</svg>
