<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Opening PayPal | Coast Internet Radio</title>
  <meta name="description" content="Continue from Coast Internet Radio to the station's PayPal support page.">
  <meta id="theme-color" name="theme-color" content="#f6f1e6">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://coastinternetradio.com/paypal-redirect.html">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/site-preferences.js?v=20260517"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="paypal-handoff-page">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="/" aria-label="Coast Internet Radio - home">
        <img id="handoff-logo"
             src="/assets/images/coast-round-logo-192.webp"
             data-light-src="/assets/images/coast-round-logo-light-192.webp"
             alt=""
             width="74"
             height="74">
        <span class="wordmark-text">Coast Internet Radio</span>
      </a>

      <div class="header-spacer" aria-hidden="true"></div>
      <a class="support-header" href="/">Back to Coast</a>
    </div>
  </header>

  <main id="main" class="shell paypal-handoff-main">
    <section class="paypal-handoff" aria-labelledby="paypal-title">
      <p class="section-title">Support Coast Internet Radio</p>
      <h1 id="paypal-title">Opening PayPal</h1>
      <p class="handoff-intro">You are being redirected to PayPal to support the station.</p>

      <form id="paypal-form" action="https://www.paypal.com/cgi-bin/webscr" method="post">
        <input type="hidden" name="cmd" value="_s-xclick">
        <input type="hidden" name="hosted_button_id" value="QYFZXU895WSE8">
        <button class="primary-button" type="submit">Continue to PayPal</button>
      </form>

      <p class="handoff-note">If PayPal does not open automatically, use the button above.</p>
    </section>
  </main>

  <script src="/paypal-redirect.js?v=20260716" defer></script>
</body>
</html>
